substitutions:
  _API_IMAGE: ""

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - Dockerfile.api
      - --tag
      - ${_API_IMAGE}
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_API_IMAGE}

images:
  - ${_API_IMAGE}

# The build runs as a user-specified service account (cloud-run.sh passes
# --service-account: the dedicated build identity, never the Compute default
# service account), which requires logs to go to Cloud Logging only.
options:
  logging: CLOUD_LOGGING_ONLY
