name: ci

on:
  pull_request:

# Release acceptance: every job below is MANDATORY for a commit to be a
# release candidate (docs/production-readiness/SCOPED_BATCH_PRODUCTION_RUNBOOK.md
# lists them by name). None of them is path-filtered or conditional, and
# tests/test_ci_workflow_static.py pins that contract.
jobs:
  offline-checks:
    # Backend unit/contract suite plus the core static safety scans. The two
    # executable-PostgreSQL modules run ONLY in postgres-checks (strict gate,
    # skips forbidden); every other PostgreSQL-backed fixture that remains in
    # this suite (the Stage D capture-SQL fixture) is made mandatory by
    # MILO_REQUIRE_PG_TESTS, so it can never skip silently here either.
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: offline-placeholder
      JOB_LAUNCHER: disabled
      MILO_REQUIRE_PG_TESTS: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history (the repository is a few MB): the Stage D release
          # binding tests compare against a pinned release commit and walk
          # ancestors of HEAD. On a depth-1 checkout they could only skip.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Backend offline tests
        run: >-
          pytest -q -rs tests
          --ignore=legacy/milo-streamlit-v1/test_websearch.py
          --ignore=tests/test_migrations_postgres.py
          --ignore=tests/test_worker_rpc_acl_postgres.py
      - name: Migration syntax smoke check
        run: python scripts/check_migrations.py
      - name: Secret scan
        run: python scripts/secret_scan.py
      - name: Unsafe default / execution-flag scan
        run: python scripts/check_unsafe_defaults.py
      - name: ShellCheck release/operator scripts
        run: |
          # ShellCheck ships in the ubuntu-latest runner image; install it only
          # if a future image drops it (the lint itself always runs).
          if ! command -v shellcheck > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck --version
          shellcheck -x -S warning -P scripts/release:scripts/release/stage-d:scripts/deploy:scripts/catalog scripts/release/*.sh scripts/release/lib/common.sh scripts/release/stage-d/*.sh scripts/deploy/*.sh scripts/catalog/*.sh
      - name: Release manifest schema validation
        run: python scripts/release/validate_production_manifest.py --manifest config/production.example.yaml --mode plan
      - name: OFFLINE release-tooling self-check (no credentials; does NOT verify live production)
        # production-readiness.sh with no operator arguments: proves the
        # orchestrator runs read-only with no external call and no mutation.
        # Every GCP / Supabase / Redis / Vercel check reports MANUAL here, so
        # its "RESULT: OK" is NOT production readiness; that requires the
        # authenticated operator run described in docs/production-readiness.
        run: bash scripts/release/production-readiness.sh

  frontend-and-docker:
    # Container images and the complete frontend gate. Split out of
    # offline-checks so it runs in parallel with the backend suite; it is
    # exactly as mandatory as before.
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: offline-placeholder
      JOB_LAUNCHER: disabled
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Docker build API
        run: docker build -f Dockerfile.api -t milo-agent-api:ci .
      - name: Docker build worker
        run: docker build -f Dockerfile.worker -t milo-agent-worker:ci .
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend production build
        working-directory: frontend
        run: npm run build
      - name: Frontend type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Frontend tests
        working-directory: frontend
        run: npm test -- --run
      - name: Frontend static UI check
        working-directory: frontend
        run: npm run test:static
      - name: Frontend secret bundle check
        working-directory: frontend
        # The production build above always runs first, so the scan of the
        # SERVED client bundle must never degrade to "no build output found".
        env:
          MILO_REQUIRE_BUNDLE_SCAN: '1'
        run: npm run test:secrets

  postgres-checks:
    # Real ephemeral PostgreSQL validation of every migration and every
    # concurrency/security property. MILO_REQUIRE_PG_TESTS turns any
    # missing-binary skip into a hard failure, so this job can never pass
    # without actually executing the suite.
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: offline-placeholder
      JOB_LAUNCHER: disabled
      MILO_REQUIRE_PG_TESTS: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PostgreSQL server binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Executable migration + concurrency + RLS + RPC ACL suite (skips forbidden)
        run: |
          # `pytest | tee` returns TEE's status, so without pipefail this job
          # could only ever fail on a skip -- a failing suite exited 0 and the
          # check went green. The gate now reports what the suite actually did.
          # These two modules are the executable-PostgreSQL suites; they run
          # here and ONLY here (offline-checks ignores them).
          set -o pipefail
          pytest -rs tests/test_migrations_postgres.py tests/test_worker_rpc_acl_postgres.py | tee pg-test-output.txt
          if grep -qE "SKIPPED|skipped" pg-test-output.txt; then
            echo "PostgreSQL tests were skipped; failing the job."
            exit 1
          fi
      - name: Migration static check
        run: python scripts/check_migrations.py

  e2e:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: offline-placeholder
      JOB_LAUNCHER: disabled
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run isolated E2E suite (mocked auth, worker and model adapters)
        working-directory: frontend
        run: npx playwright test

