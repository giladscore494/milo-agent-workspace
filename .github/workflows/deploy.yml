name: Deploy production

# Plan decision 23: operate production from a phone. The operator R block as
# ONE workflow run: CI green on the exact SHA, the complete migration set
# applied, Vercel built that SHA with run starts closed, 0 live runs, the Stage
# 2 reset (unless permanent operating mode), production-activate.sh --all, the
# reviewed worker model env, the worker contract, and the deployed gate. Every
# step is scripts/ops/deploy.sh, which wraps the canonical tools unchanged and
# writes SUMMARY| lines to the job summary.
#
# Google Cloud is reached through Workload Identity Federation only
# (scripts/ops/setup-wif.sh): no key exists. The read-only database URL is the
# `production` environment secret MILO_READONLY_DB_URL, handed to the one step
# that needs it and never printed. Nothing here starts a run, prepares a plan
# or arms Stage 2.
#
# restore_website_stage: a Stage A deploy turns the website's plan tools off.
# Only after a SUCCESSFUL deploy (step 11 of deploy.sh, reached only when 1-10
# passed) the named ones come back on through scripts/ops/website-stage.sh:
# Stage P (plan authoring) and/or E' (the Prepare button), and/or the
# Register page (register-capture, which needs REGISTER_ARCHIVE_BUCKET), and/or
# the read-only catalog browser (catalog-browser; all = both + register-capture
# + catalog-browser). Never Stage 2 --
# paid execution stays with arm.yml. Skipped in permanent operating mode, which
# keeps the live stage.
#
# preflight_as_deployer (PR-Ops3): instead of deploying, run every read-only
# gcloud call the deploy makes AS the deployer, plus testIamPermissions probes
# for the build submit and actAs permissions, and report every missing API,
# permission and resource at once (scripts/ops/preflight-deployer.sh). It
# never builds, deploys or changes anything; the Deploy step does not run.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Exact 40-character release SHA (a commit on main)"
        required: true
        type: string
      restore_website_stage:
        description: "After a successful deploy, turn these website plan tools back on"
        required: false
        default: both
        type: choice
        options:
          - both
          - plan-authoring
          - web-preparation
          - register-capture
          - catalog-browser
          - all
          - none
      dry_run:
        description: "Print every command and call nothing"
        required: false
        default: false
        type: boolean
      preflight_as_deployer:
        description: "Read-only: run the deploy's gcloud reads and permission probes as the deployer, report every gap, deploy nothing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write
  checks: read

concurrency:
  group: milo-production-operations
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    steps:
      - name: Refuse anything but main and a full SHA
        env:
          SHA_INPUT: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Dispatch this workflow from main only."
            exit 1
          fi
          if [[ ! "${SHA_INPUT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "sha must be exactly 40 lowercase hexadecimal characters."
            exit 1
          fi

      - name: Check out the release
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: The release is a commit on main
        env:
          SHA_INPUT: ${{ inputs.sha }}
        run: git merge-base --is-ancestor "${SHA_INPUT}" origin/main

      - name: Authenticate to Google Cloud (Workload Identity Federation, no key)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: The checkout is still clean after authenticating
        # google-github-actions/auth writes gha-creds-*.json into the workspace.
        # It must be ignored (.gitignore, .dockerignore, .gcloudignore) so it
        # is neither a local change nor uploaded by gcloud builds submit.
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain)"
          if [[ -n "${dirty}" ]]; then
            echo "::error::The checkout changed while authenticating to Google Cloud. Only ignored files may appear (the auth step's gha-creds-*.json credentials file). Not ignored:"
            printf '%s\n' "${dirty}"
            exit 1
          fi
          if ! grep -qxF 'gha-creds-*.json' .gcloudignore; then
            echo "::error::.gcloudignore does not exclude gha-creds-*.json: gcloud builds submit would upload the credentials file."
            exit 1
          fi
          echo "Clean: the credentials file is ignored and nothing else changed."

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Operator configuration (identifiers only)
        env:
          MILO_OPERATOR_CONFIG_TEXT: ${{ vars.MILO_OPERATOR_CONFIG }}
        run: bash scripts/ops/write-operator-config.sh

      - name: Set up Python (the preflight and gates import backend/)
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: PostgreSQL client
        run: command -v psql > /dev/null || { sudo apt-get update && sudo apt-get install -y postgresql-client; }

      - name: Preflight as the deployer (read-only, deploys nothing)
        if: ${{ inputs.preflight_as_deployer }}
        env:
          SHA_INPUT: ${{ inputs.sha }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--sha "${SHA_INPUT}")
          if [[ "${DRY_RUN_INPUT}" == "true" ]]; then
            args+=(--dry-run)
          fi
          bash scripts/ops/preflight-deployer.sh "${args[@]}"

      - name: Deploy
        if: ${{ !inputs.preflight_as_deployer }}
        env:
          SHA_INPUT: ${{ inputs.sha }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          RESTORE_INPUT: ${{ inputs.restore_website_stage || 'both' }}
          PERMANENT_MODE: ${{ vars.MILO_PERMANENT_MODE || 'false' }}
          GH_TOKEN: ${{ github.token }}
          MILO_READONLY_DB_URL: ${{ secrets.MILO_READONLY_DB_URL }}
        run: |
          set -euo pipefail
          args=(--sha "${SHA_INPUT}" --permanent-mode "${PERMANENT_MODE}"
                --restore-website-stage "${RESTORE_INPUT}")
          if [[ "${DRY_RUN_INPUT}" == "true" ]]; then
            args+=(--dry-run)
          fi
          bash scripts/ops/deploy.sh "${args[@]}"
