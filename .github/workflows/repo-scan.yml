name: Repo Scan

on:
  pull_request:

# legacy/milo-streamlit-v1 is the IMMUTABLE reference snapshot of the Streamlit
# prototype (its byte-identical duplicate MILO-main-original/ was removed in
# cleanup D6). Nothing in the product imports it (.dockerignore excludes it);
# the V1 parity tests in the main suite load legacy/milo-streamlit-v1/app.py.
#
# The job below ALWAYS runs and ALWAYS reports under the same check name, so
# a check that is (or later becomes) required can never be left pending:
#   1. archive integrity (always): every snapshot file matches
#      archive/SHA256SUMS.txt, and the snapshot directories hold exactly the
#      files the manifest lists -- nothing added, nothing missing;
#   2. the prototype's own ruff lint and offline tests (only when a snapshot,
#      the manifest or this workflow changes). With the bytes proven identical
#      to the manifest, re-running them on an unrelated change can only fail
#      for external reasons (unpinned prototype requirements, linter churn).
# If the changed-file set cannot be determined, step 2 runs (fail-safe).
# tests/test_ci_workflow_static.py pins this contract.
jobs:
  scan:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Needed to diff against the PR base / previous main commit.
          fetch-depth: 0

      - name: Archive integrity (SHA256 manifest, always)
        run: |
          set -euo pipefail
          sha256sum --strict -c archive/SHA256SUMS.txt
          expected="$(awk '{print $2}' archive/SHA256SUMS.txt | sort)"
          actual="$(git ls-files legacy | sort)"
          if [ "${expected}" != "${actual}" ]; then
            echo "Snapshot directories do not hold exactly the files in archive/SHA256SUMS.txt:"
            diff <(printf '%s\n' "${expected}") <(printf '%s\n' "${actual}") || true
            exit 1
          fi
          echo "Archive integrity verified: $(printf '%s\n' "${expected}" | wc -l) files."

      - name: Decide whether the prototype snapshot is affected
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail
          if [ "${EVENT_NAME:-}" = "pull_request" ]; then
            base="${PR_BASE_SHA:-}"
          else
            base="${PUSH_BEFORE_SHA:-}"
          fi
          run_prototype=true
          if [[ "${base}" =~ ^[0-9a-f]{40}$ ]] && [[ ! "${base}" =~ ^0+$ ]] \
             && changed="$(git diff --name-only "${base}" HEAD 2>/dev/null)"; then
            if ! printf '%s\n' "${changed}" | grep -qE '^(legacy/|archive/SHA256SUMS\.txt$|\.github/workflows/repo-scan\.yml$)'; then
              run_prototype=false
            fi
          else
            echo "Could not determine the changed files; running the prototype checks."
          fi
          echo "run_prototype=${run_prototype}" >> "${GITHUB_OUTPUT}"
          echo "Prototype lint/tests required: ${run_prototype}"

      - name: Set up Python
        if: steps.scope.outputs.run_prototype != 'false'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.scope.outputs.run_prototype != 'false'
        working-directory: legacy/milo-streamlit-v1
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # ruff is pinned: legacy/milo-streamlit-v1 is an immutable reference
          # snapshot, so the linter must stay fixed rather than the code
          # chasing new default rules. Ruff 0.16 widened its default rule
          # set (UP006/UP045/I001/RUF012/EXE001), turning this job red with
          # no source change. Bump deliberately, with the snapshot review
          # that implies.
          pip install ruff==0.15.22 pytest

      - name: Lint (ruff)
        if: steps.scope.outputs.run_prototype != 'false'
        working-directory: legacy/milo-streamlit-v1
        run: ruff check .

      - name: Run tests
        if: steps.scope.outputs.run_prototype != 'false'
        working-directory: legacy/milo-streamlit-v1
        run: pytest -v test_safe_agent_pipeline.py test_safety_guards.py
