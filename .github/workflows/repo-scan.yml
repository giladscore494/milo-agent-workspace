name: Repo Scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MILO-main-original/MILO-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # ruff is pinned: MILO-main-original is an immutable reference
          # snapshot, so the linter must stay fixed rather than the code
          # chasing new default rules. Ruff 0.16 widened its default rule
          # set (UP006/UP045/I001/RUF012/EXE001), turning this job red with
          # no source change. Bump deliberately, with the snapshot review
          # that implies.
          pip install ruff==0.15.22 pytest

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest -v test_safe_agent_pipeline.py test_safety_guards.py
