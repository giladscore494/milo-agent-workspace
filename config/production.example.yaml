# MILO production release configuration manifest — TEMPLATE.
#
# Non-secret metadata only: names, identifiers and flags. NEVER put a
# secret value, credential, token or key in this file. Secret entries below
# are Secret Manager RESOURCE NAMES, not values.
#
# Copy to a private operator location, replace every <PLACEHOLDER>, and
# validate with:
#   python3 scripts/release/validate_production_manifest.py --manifest <copy> --mode plan
# Apply-mode validation (used by generators before any mutation-capable
# operation) additionally rejects placeholders:
#   python3 scripts/release/validate_production_manifest.py --manifest <copy> --mode apply

gcp:
  project_id: "<GCP_PROJECT_ID>"
  region: "<GCP_REGION>"
  artifact_registry_repository: "<ARTIFACT_REGISTRY_REPOSITORY>"
  cloud_run_api_service: "<CLOUD_RUN_API_SERVICE>"
  cloud_run_worker_job: "<CLOUD_RUN_WORKER_JOB>"

identities:
  api_service_account: "<API_SERVICE_ACCOUNT_EMAIL>"
  worker_service_account: "<WORKER_SERVICE_ACCOUNT_EMAIL>"
  gateway_identity: "<GATEWAY_IDENTITY_EMAIL>"
  deploy_operator: "<OPERATOR_EMAIL>"

supabase:
  # Non-secret. This is the APPROVED production Supabase project, and it is
  # the source of the deployment's MILO_EXPECTED_SUPABASE_PROJECT_REF binding
  # on BOTH the API service and the worker job. The runtime refuses to start
  # if it is absent, malformed, or if SUPABASE_URL is not this project's
  # hosted https://<ref>.supabase.co URL — so a production deployment can
  # never silently point at another Supabase project. Fill it in on your
  # private copy only; the concrete ref never enters this repository.
  project_ref: "<SUPABASE_PROJECT_REF>"

vercel:
  project_name: "<VERCEL_PROJECT_NAME>"

redis:
  logical_environment: "production"

cors:
  # Explicit browser origins only. Wildcards are rejected by validation.
  allowed_origins:
    - "<PRODUCTION_VERCEL_ORIGIN>"

release:
  # Full 40-character immutable commit SHA. Mutable tags are rejected.
  sha: "<RELEASE_SHA>"
  # Last known-good release SHA used as the rollback target.
  rollback_sha: "<PREVIOUS_RELEASE_SHA>"

# Environment-variable NAMES that carry the run's enforceable limits (values
# are configured on the Cloud Run services, not here). This list must cover
# every dimension backend/runtime_policy.py marks mandatory for paid
# execution; validate_production_manifest.py derives that set from the policy
# and rejects a manifest that has fallen behind it.
budgets:
  - MILO_DAILY_PROJECT_BUDGET
  - MILO_DAILY_USER_BUDGET
  - MILO_MAX_AGENT_STEPS
  - MILO_MAX_CONCURRENT_RUNS_PER_PROJECT
  - MILO_MAX_CONCURRENT_RUNS_PER_USER
  - MILO_MAX_COST_PER_RUN
  - MILO_MAX_ESTIMATED_COST_PER_RUN
  - MILO_MAX_INPUT_TOKENS_PER_RUN
  - MILO_MAX_MODEL_CALLS_PER_RUN
  - MILO_MAX_OUTPUT_TOKENS_PER_RUN
  - MILO_MAX_REPLANS_PER_RUN
  - MILO_MAX_RETRIES
  - MILO_MAX_RUN_DURATION_SECONDS
  - MILO_MAX_TASKS_PER_RUN
  - MILO_MAX_TOOL_CALLS_PER_RUN
  - MILO_MAX_TOTAL_TOKENS_PER_RUN
  - MILO_PROVIDER_TPM_LIMIT
  - MILO_SWARM_MAX_ACTIVE_WORKERS

# Execution flags with their required Stage A values. Validation rejects a
# manifest that turns any of these on during Stage A.
execution_flags:
  MILO_ENABLE_RUN_CREATION: false
  MILO_ENABLE_PROPOSAL_MUTATIONS: false
  MILO_ENABLE_PROPOSAL_READS: false
  MILO_ENABLE_RUN_CANCELLATION: false
  MILO_ENABLE_EXECUTION_CONTROL: false
  MILO_ENABLE_PAID_EXECUTION: false
  # Worker-only: the catalog capability inside a Swarm V2 run (the Government
  # tool, its scope and evidence mapper, and the canonical promotion pipeline).
  # Enabling it is a separate, explicitly authorized operator decision and is
  # never part of a release — see docs/production-readiness/STAGED_ACTIVATION.md.
  MILO_ENABLE_CATALOG_EXECUTION: false
  # Read-only access to the durable government register. Grants the bounded
  # read tool, its scope and its evidence mapper, and authorizes NO write.
  MILO_ENABLE_GOVERNMENT_CATALOG_READ: false
  # Canonical catalog promotion. Requires the read flag above; read alone
  # never implies promotion.
  MILO_ENABLE_CATALOG_PROMOTION: false
  # Mapping Plan writes (create / revise a conversation's work scope). A plan
  # is a draft and executes nothing; the writes still stay off until a stage
  # enables them deliberately.
  MILO_ENABLE_WORK_SCOPE_MUTATIONS: false
  GATEWAY_ALLOW_EXECUTION_ROUTES: false

# Secret Manager RESOURCE NAMES (never values) and their sole consumers.
secrets:
  supabase_url:
    name: "<SUPABASE_URL_SECRET_NAME>"
    consumers: ["api", "worker"]
  supabase_service_key:
    name: "<SUPABASE_SERVICE_KEY_SECRET_NAME>"
    consumers: ["api", "worker"]
  # Bound to NOTHING during Stage A — the deployment tools refuse to emit a
  # command that binds it. An operator introduces it to the worker job only,
  # as an explicit Stage C action.
  provider_api_key:
    name: "<PROVIDER_KEY_SECRET_NAME>"
    consumers: ["worker"]
  redis_rest_url:
    name: "<REDIS_URL_SECRET_NAME>"
    consumers: ["api", "worker"]
  redis_rest_token:
    name: "<REDIS_TOKEN_SECRET_NAME>"
    consumers: ["api", "worker"]
